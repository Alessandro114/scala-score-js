name: CI
on:
  push: { branches: [main, master] }
  pull_request:

jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # npm ci e non npm install: fallisce se package-lock.json non e
      # allineato, che e esattamente il difetto che vogliamo vedere qui e
      # non sul portatile di chi clona.
      - run: npm ci
      - run: npm run build
      - run: npm test
